<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Aurum Agents | مرکز فرماندهی چندعاملی</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;700&family=Vazirmatn:wght@300;500;800&display=swap">
<style>
:root{--bg:#070b1a;--gold:#f3c9b8;--brass:#d08f7c;--ivory:#f1f3fb;--ok:#8fd8ee;--line:rgba(243,201,184,.22);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:radial-gradient(ellipse at 50% 20%,#1a2350,var(--bg) 65%);color:var(--ivory);font-family:'Vazirmatn',system-ui,sans-serif;min-height:100vh}
.wrap{max-width:1040px;margin:0 auto;padding:28px 18px 70px}
.en{font-family:'Cormorant Garamond',serif;color:var(--brass);letter-spacing:.4em;font-size:15px;margin-bottom:4px}
h1{margin:0;font-weight:800;font-size:clamp(28px,5vw,42px);background:linear-gradient(180deg,#fff0e8,var(--gold) 50%,var(--brass));-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{font-weight:300;color:rgba(241,243,251,.65);margin:6px 0 22px;font-size:14px}
.ctrl{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.seg{display:flex;border:1px solid var(--line);border-radius:3px;overflow:hidden}
.seg button{font:inherit;font-size:13px;color:var(--ivory);background:transparent;border:0;padding:10px 16px;cursor:pointer;opacity:.65}
.seg button.a{background:rgba(243,201,184,.14);opacity:1;color:var(--gold)}
.btn{font:inherit;font-weight:500;font-size:15px;color:#2a1410;border:0;padding:11px 28px;border-radius:2px;cursor:pointer;background:linear-gradient(135deg,#ffe1d4,var(--brass));box-shadow:0 8px 28px rgba(208,143,124,.35)}
.btn:disabled{opacity:.5;cursor:default}button:focus-visible{outline:2px solid var(--ivory);outline-offset:3px}
.stage{border:1px solid var(--line);border-radius:3px;background:rgba(7,11,26,.5);position:relative;overflow:hidden}
canvas{display:block;width:100%;height:clamp(340px,52vw,460px)}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px;margin-top:16px}
.box{border:1px solid var(--line);border-radius:3px;padding:16px 18px;background:rgba(241,243,251,.04);min-height:220px}
.box h2{margin:0 0 12px;font-size:15px;font-weight:500;color:var(--gold)}
.log{display:grid;gap:9px;font-size:13px;line-height:1.8;font-weight:300}
.log div{animation:in .4s}.log b{font-weight:500;color:var(--gold);margin-left:8px}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.empty{color:rgba(241,243,251,.5);font-weight:300;font-size:13px;line-height:2}
.out .nm{font-family:'Cormorant Garamond','Vazirmatn',serif;font-size:34px;font-weight:700;color:var(--gold);line-height:1.2}
.out .tg{font-size:14px;font-weight:300;margin:4px 0 14px;color:rgba(241,243,251,.8)}
.kpi{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.kpi div{border:1px solid var(--line);padding:8px;text-align:center;border-radius:3px}
.kpi b{display:block;font-family:'Cormorant Garamond',serif;font-size:26px;color:var(--gold)}.kpi span{font-size:11px;color:rgba(241,243,251,.6)}
.tl{list-style:none;margin:0;padding:0 14px 0 0;border-right:1px solid var(--brass);display:grid;gap:8px;font-size:13px;font-weight:300}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<div class="wrap">
 <div class="en">AURUM AGENTS</div>
 <h1>مرکز فرماندهی عامل‌های هوشمند</h1>
 <div class="sub">یک مأموریت بده، پنج عامل تخصصی با هماهنگی مدیر پروژه آن را اجرا می‌کنند</div>
 <div class="ctrl"><div class="seg" role="group" aria-label="مأموریت"><button class="a" id="m1">راه‌اندازی برند عطر</button><button id="m2">برنامه محتوای کافه</button></div><button class="btn" id="run">شروع مأموریت</button></div>
 <div class="stage"><canvas id="c" aria-label="نمودار ارتباط عامل‌ها"></canvas></div>
 <div class="cols">
  <div class="box"><h2>گزارش زنده عامل‌ها</h2><div class="log" id="log"><div class="empty">با شروع مأموریت، گزارش کار هر عامل اینجا ظاهر می‌شود.</div></div></div>
  <div class="box out"><h2>خروجی نهایی</h2><div id="out"><div class="empty">خروجی پس از پایان بازبینی نمایش داده می‌شود.</div></div></div>
 </div>
</div>
<script>
(function(){
const $=id=>document.getElementById(id),sleep=ms=>new Promise(r=>setTimeout(r,ms));
const A=['پژوهشگر','استراتژیست','نویسنده','طراح','بازبین'];
const M={
m1:{logs:['تحلیل ۱۲ رقیب و روند بازار عطر نیچ','موقعیت‌یابی برند: عطری که حافظه می‌سازد','نوشتن نام، شعار و متن معرفی محصول','پالت مشکی و طلایی و طرح بسته‌بندی','بازبینی لحن و یکپارچگی هویت برند'],o:{n:'Mémoire Noir',t:'عطری که لحظه‌هایت را ماندگار می‌کند',k:[['۱۲','رقیب تحلیل‌شده'],['۴','هفته تا عرضه'],['۳','کانال اصلی']],p:['هفته ۱: ساخت هویت و صفحه فرود','هفته ۲: تیزر و همکاری با اینفلوئنسر','هفته ۳: پیش‌فروش محدود','هفته ۴: عرضه و رویداد خصوصی']}},
m2:{logs:['بررسی ۸ کافه رقیب و ساعت‌های پرتردد','محتوا حول «آرامش وسط شهر» تعریف شد','نوشتن ۳۰ کپشن و ۸ متن استوری','طرح قالب‌های پست و منوی فصلی','بازبینی هماهنگی لحن در همه پست‌ها'],o:{n:'کافه آرام',t:'یک استراحت کوتاه، وسط شلوغی شهر',k:[['۳۰','روز محتوا'],['۸','قالب طراحی'],['۴','ستون محتوایی']],p:['هفته ۱: معرفی فضا و منو','هفته ۲: داستان باریستاها','هفته ۳: چالش مشتریان وفادار','هفته ۴: رویداد و جمع‌بندی']}}};
let cur='m1',busy=false;
function pick(k){if(busy)return;cur=k;$('m1').classList.toggle('a',k==='m1');$('m2').classList.toggle('a',k==='m2')}
$('m1').onclick=()=>pick('m1');$('m2').onclick=()=>pick('m2');
// canvas
const cv=$('c'),x=cv.getContext('2d');let W=0,H=0,D=1;
function size(){D=Math.min(devicePixelRatio||1,2);W=cv.clientWidth;H=cv.clientHeight;cv.width=W*D;cv.height=H*D;x.setTransform(D,0,0,D,0,0)}
addEventListener('resize',size);size();
const S=[0,0,0,0,0],O={s:0};let P=[],t0=performance.now(),calm=matchMedia('(prefers-reduced-motion:reduce)').matches;
const COL=s=>s===1?'#f3c9b8':s===2?'#8fd8ee':'#d08f7c';
function pos(i,t){const cx=W/2,cy=H/2,rx=W*.36,ry=H*.34;if(i<0)return[cx,cy];const a=-Math.PI/2+i*Math.PI*2/5,f=calm?0:Math.sin(t/900+i)*4;return[cx+Math.cos(a)*rx,cy+Math.sin(a)*ry+f]}
function dia(px,py,r,st,t,lbl,big){
  x.save();x.translate(px,py);
  if(st===1){x.shadowColor='#f3c9b8';x.shadowBlur=18+Math.sin(t/200)*8}
  x.rotate(Math.PI/4);x.fillStyle='#0e1530';x.strokeStyle=COL(st);x.lineWidth=st?2:1.2;
  x.beginPath();x.rect(-r,-r,r*2,r*2);x.fill();x.stroke();
  x.rotate(-Math.PI/4);x.shadowBlur=0;x.fillStyle=COL(st);x.beginPath();x.arc(0,0,r*.28,0,7);x.fill();
  x.restore();
  x.fillStyle=st?'#f1f3fb':'rgba(241,243,251,.6)';x.font=`${W<500?11:13}px Vazirmatn,sans-serif`;x.textAlign='center';x.direction='rtl';
  x.fillText(lbl,px,py+r*1.5+(big?10:6)+8)}
function draw(now){
  const t=now-t0,dt=16;x.clearRect(0,0,W,H);
  for(let i=0;i<5;i++){const[a,b]=pos(i,t),[c,d]=pos(-1,t);x.strokeStyle='rgba(243,201,184,.18)';x.lineWidth=1;x.beginPath();x.moveTo(a,b);x.lineTo(c,d);x.stroke();
    const n=(i+1)%5,[e,f]=pos(n,t);x.strokeStyle='rgba(243,201,184,.07)';x.beginPath();x.moveTo(a,b);x.lineTo(e,f);x.stroke()}
  P=P.filter(p=>{p.t+=dt/750;if(p.t>=1){p.r();return false}
    const[a,b]=pos(p.a,t),[c,d]=pos(p.b,t),px=a+(c-a)*p.t,py=b+(d-b)*p.t;
    x.save();x.shadowColor='#f3c9b8';x.shadowBlur=16;x.fillStyle='#fff0e8';x.beginPath();x.arc(px,py,3.4,0,7);x.fill();x.restore();return true});
  const r=W<500?15:20;
  for(let i=0;i<5;i++){const[a,b]=pos(i,t);dia(a,b,r,S[i],t,A[i])}
  const[cx,cy]=pos(-1,t);dia(cx,cy,r*1.4,O.s,t,'مدیر پروژه',true);
  requestAnimationFrame(draw)}
requestAnimationFrame(draw);
const pulse=(a,b)=>new Promise(r=>P.push({a,b,t:0,r}));
async function type(el,txt){for(let i=1;i<=txt.length;i++){el.textContent=txt.slice(0,i);await sleep(16)}}
async function work(i,m){
  await pulse(-1,i);S[i]=1;
  const d=document.createElement('div');d.innerHTML=`<b>${A[i]}</b><span></span>`;$('log').appendChild(d);
  await type(d.lastChild,m.logs[i]);await sleep(500);
  await pulse(i,-1);S[i]=2}
async function run(){
  if(busy)return;busy=true;$('run').disabled=true;const m=M[cur];
  S.fill(0);O.s=1;$('log').innerHTML='';$('out').innerHTML='<div class="empty">در حال اجرا...</div>';
  await Promise.all([work(0,m),work(1,m)]);
  await Promise.all([work(2,m),work(3,m)]);
  await work(4,m);
  O.s=2;const o=m.o;
  $('out').innerHTML=`<div class="nm">${o.n}</div><div class="tg">${o.t}</div><div class="kpi">${o.k.map(k=>`<div><b>${k[0]}</b><span>${k[1]}</span></div>`).join('')}</div><ul class="tl">${o.p.map(p=>`<li>${p}</li>`).join('')}</ul>`;
  busy=false;$('run').disabled=false;$('run').textContent='اجرای دوباره';
}
$('run').onclick=run;
})();
</script>
</body>
</html>
