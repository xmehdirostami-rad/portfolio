<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>آوروم | Aurum</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;700&family=Vazirmatn:wght@300;500;800&display=swap">
<style>
:root{--bg:#06100d;--gold:#e8d5a3;--brass:#b8924a;--ivory:#f4efe4;--wine:#5a1424;--glass:rgba(244,239,228,.06);--line:rgba(232,213,163,.28);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ivory);font-family:'Vazirmatn',system-ui,sans-serif;overflow:hidden;touch-action:none;user-select:none}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
.vig{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 55%,transparent 45%,rgba(2,6,5,.85) 100%)}
.hud{position:fixed;inset:0;pointer-events:none;padding:calc(env(safe-area-inset-top,0px) + 18px) 22px 18px;display:flex;justify-content:space-between;align-items:flex-start;opacity:0;transition:opacity .6s}
.playing .hud{opacity:1}
.stat{font-family:'Cormorant Garamond',serif;font-weight:700;font-size:clamp(34px,7vw,56px);line-height:1;color:var(--gold);text-shadow:0 0 24px rgba(232,213,163,.35)}
.lbl{font-size:12px;color:rgba(244,239,228,.6);margin-top:6px;font-weight:300;letter-spacing:.04em}
.gems{text-align:left;direction:ltr}
.gems .stat{font-size:clamp(26px,5vw,38px)}
.speed{position:fixed;left:22px;right:22px;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);height:2px;background:rgba(232,213,163,.15);opacity:0;transition:opacity .6s}
.playing .speed{opacity:1}
.speed i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--brass),var(--gold));box-shadow:0 0 12px var(--gold);float:right}
.screen{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;transition:opacity .7s,visibility .7s}
.screen.off{opacity:0;visibility:hidden;pointer-events:none}
.card{width:min(440px,100%);text-align:center;padding:44px 32px 34px;border:1px solid var(--line);border-radius:3px;background:linear-gradient(160deg,rgba(244,239,228,.09),rgba(244,239,228,.02));backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:0 40px 120px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.12);position:relative}
.card:before{content:"";position:absolute;inset:7px;border:1px solid rgba(232,213,163,.14);border-radius:1px;pointer-events:none}
.mark{width:54px;height:54px;margin:0 auto 18px;transform:rotate(45deg);border:1px solid var(--gold);display:grid;place-items:center;box-shadow:0 0 30px rgba(232,213,163,.25)}
.mark b{width:22px;height:22px;background:linear-gradient(135deg,var(--gold),var(--brass))}
h1{margin:26px 0 4px;font-weight:800;font-size:clamp(46px,12vw,68px);line-height:1.1;background:linear-gradient(180deg,#fff6dc,var(--gold) 45%,var(--brass));-webkit-background-clip:text;background-clip:text;color:transparent}
.en{font-family:'Cormorant Garamond',serif;font-size:19px;letter-spacing:.55em;color:var(--brass);margin-bottom:22px;padding-right:.55em}
p{margin:0 auto 28px;font-weight:300;line-height:2;color:rgba(244,239,228,.78);max-width:34ch;font-size:15px}
.btn{pointer-events:auto;cursor:pointer;font:inherit;font-weight:500;font-size:17px;color:#1a1305;border:0;padding:15px 44px;border-radius:2px;background:linear-gradient(135deg,#f6e7bd,var(--brass));box-shadow:0 10px 36px rgba(184,146,74,.35),inset 0 1px 0 rgba(255,255,255,.6);transition:transform .25s,box-shadow .25s}
.btn:hover{transform:translateY(-2px);box-shadow:0 16px 46px rgba(184,146,74,.5),inset 0 1px 0 rgba(255,255,255,.6)}
.btn:focus-visible{outline:2px solid var(--ivory);outline-offset:4px}
.keys{margin-top:24px;font-size:12px;color:rgba(244,239,228,.5);font-weight:300;line-height:1.9}
.res{display:flex;justify-content:center;gap:34px;margin:6px 0 28px}
.res div{min-width:70px}.res .stat{font-size:42px}
.best{color:var(--ivory)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<canvas id="c" aria-label="بازی سه‌بعدی آوروم"></canvas>
<div class="vig"></div>
<div class="hud"><div><div class="stat" id="score">۰</div><div class="lbl">امتیاز</div></div><div class="gems"><div class="stat" id="gems">۰</div><div class="lbl" style="direction:rtl">جواهر جمع‌شده</div></div></div>
<div class="speed"><i id="spd"></i></div>

<div class="screen" id="start"><div class="card">
<div class="mark"><b></b></div>
<h1>آوروم</h1><div class="en">AURUM</div>
<p>روی مرمر سیاه می‌غلتی. جواهرها را جمع کن، از سنگ‌های تیره بگذر و سرعت را تا آخر نگه دار.</p>
<button class="btn" id="go">شروع بازی</button>
<div class="keys">حرکت: ← → یا A D &nbsp;|&nbsp; پرش: فاصله یا ↑<br>روی موبایل: کشیدن انگشت به چپ، راست و بالا</div>
</div></div>

<div class="screen off" id="over"><div class="card">
<div class="en" style="margin-top:0">GAME OVER</div>
<h1 style="font-size:clamp(34px,9vw,48px);margin-top:0">مسیر تمام شد</h1>
<div class="res"><div><div class="stat" id="fs">۰</div><div class="lbl">امتیاز</div></div><div><div class="stat best" id="fb">۰</div><div class="lbl">بهترین رکورد</div></div></div>
<button class="btn" id="again">دوباره بازی کن</button>
</div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
const fa=n=>Math.round(n).toLocaleString('fa-IR');
const $=id=>document.getElementById(id);
let best=0;try{best=+localStorage.getItem('aurum-best')||0}catch(e){}
const cv=$('c');
const R=new THREE.WebGLRenderer({canvas:cv,antialias:true});
R.setPixelRatio(Math.min(devicePixelRatio,2));
R.toneMapping=THREE.ACESFilmicToneMapping;R.toneMappingExposure=1.15;
const S=new THREE.Scene();S.background=new THREE.Color(0x06100d);S.fog=new THREE.Fog(0x06100d,18,85);
const cam=new THREE.PerspectiveCamera(62,1,.1,200);
function size(){R.setSize(innerWidth,innerHeight,false);cam.aspect=innerWidth/innerHeight;cam.fov=innerWidth<innerHeight?78:62;cam.updateProjectionMatrix()}
addEventListener('resize',size);size();

// lights
S.add(new THREE.AmbientLight(0x4a6a60,.55));
const key=new THREE.DirectionalLight(0xffe8b8,1.6);key.position.set(-6,12,6);S.add(key);
const rim=new THREE.PointLight(0xe8d5a3,2.2,30);S.add(rim);
const wineL=new THREE.PointLight(0x9a2040,1.4,40);wineL.position.set(8,5,-14);S.add(wineL);

// materials
const gold=new THREE.MeshStandardMaterial({color:0xe3c070,metalness:1,roughness:.18,emissive:0x2a1c04});
const marble=new THREE.MeshStandardMaterial({color:0x0b1c17,metalness:.85,roughness:.22});
const obs=new THREE.MeshStandardMaterial({color:0x14090c,metalness:.9,roughness:.15,emissive:0x2a0610});
const gemM=new THREE.MeshStandardMaterial({color:0xfff2cc,emissive:0xe8c26a,emissiveIntensity:.9,metalness:.2,roughness:.05});
const edgeM=new THREE.LineBasicMaterial({color:0xe8d5a3});
const floor=new THREE.Mesh(new THREE.PlaneGeometry(14,260),marble);floor.rotation.x=-Math.PI/2;floor.position.z=-90;S.add(floor);

const LANES=[-2.4,0,2.4];
// rails
[-3.9,3.9].forEach(x=>{const r=new THREE.Mesh(new THREE.BoxGeometry(.18,.3,260),gold);r.position.set(x,.15,-90);S.add(r)});
// lane marks + pillars (recycled)
const mG=new THREE.BoxGeometry(.06,.02,2.4),marks=[];
for(let i=0;i<22;i++)[-1.2,1.2].forEach(x=>{const m=new THREE.Mesh(mG,gold);m.position.set(x,.02,-i*6);S.add(m);marks.push(m)});
const pG=new THREE.BoxGeometry(1.1,9,1.1),pcG=new THREE.BoxGeometry(1.3,.25,1.3),pil=[];
for(let i=0;i<10;i++)[-8,8].forEach(x=>{const g=new THREE.Group();const p=new THREE.Mesh(pG,marble);p.position.y=4.5;const c=new THREE.Mesh(pcG,gold);c.position.y=9.1;g.add(p,c);g.position.set(x,0,-i*14);S.add(g);pil.push(g)});
// stars
const sp=new Float32Array(900);for(let i=0;i<900;i+=3){sp[i]=(Math.random()-.5)*160;sp[i+1]=8+Math.random()*50;sp[i+2]=-Math.random()*180}
const sg=new THREE.BufferGeometry();sg.setAttribute('position',new THREE.BufferAttribute(sp,3));
S.add(new THREE.Points(sg,new THREE.PointsMaterial({color:0xe8d5a3,size:.28,transparent:true,opacity:.75,fog:false})));

// player
const player=new THREE.Mesh(new THREE.SphereGeometry(.7,40,40),gold);player.position.set(0,.7,0);S.add(player);
const ring=new THREE.Mesh(new THREE.TorusGeometry(.95,.025,12,64),new THREE.MeshBasicMaterial({color:0xe8d5a3,transparent:true,opacity:.5}));ring.rotation.x=Math.PI/2;S.add(ring);

// entities
const gemG=new THREE.OctahedronGeometry(.42),obG=new THREE.BoxGeometry(1.9,1.3,1.3),obEG=new THREE.EdgesGeometry(obG);
let ents=[];
function addGem(x,z){const m=new THREE.Mesh(gemG,gemM);m.scale.y=1.5;m.position.set(x,1.1,z);S.add(m);ents.push({m,t:'g'})}
function addObs(x,z){const m=new THREE.Mesh(obG,obs);m.add(new THREE.LineSegments(obEG,edgeM));m.position.set(x,.65,z);S.add(m);ents.push({m,t:'o'})}
function spawn(z){
  const free=Math.floor(Math.random()*3),mode=Math.random();
  for(let l=0;l<3;l++){if(l!==free&&(mode<.75||Math.random()<.5))addObs(LANES[l],z)}
  if(mode>.75){/* low gap row: all clear, gems in a line */}
  for(let k=0;k<5;k++)addGem(LANES[free],z+k*2.2)
}

// state
let state='menu',lane=1,vy=0,py=.7,speed=0,dist=0,gemsN=0,score=0,nextZ=-45,shake=0,t=0;
function reset(){ents.forEach(e=>S.remove(e.m));ents=[];lane=1;vy=0;py=.7;speed=15;dist=0;gemsN=0;score=0;nextZ=-45;player.position.x=0}
function begin(){reset();state='play';document.body.classList.add('playing');$('start').classList.add('off');$('over').classList.add('off')}
function end(){state='over';shake=1;document.body.classList.remove('playing');
  if(score>best){best=Math.round(score);try{localStorage.setItem('aurum-best',best)}catch(e){}}
  $('fs').textContent=fa(score);$('fb').textContent=fa(best);setTimeout(()=>$('over').classList.remove('off'),650)}
$('go').onclick=begin;$('again').onclick=begin;

// input
function move(d){if(state==='play')lane=Math.max(0,Math.min(2,lane+d))}
function jump(){if(state==='play'&&py<=.71)vy=9.5}
addEventListener('keydown',e=>{
  if(e.key==='ArrowLeft'||e.key==='a'||e.key==='A')move(-1);
  else if(e.key==='ArrowRight'||e.key==='d'||e.key==='D')move(1);
  else if(e.key==='ArrowUp'||e.key===' '||e.key==='w'||e.key==='W'){jump();e.preventDefault()}
  else if(e.key==='Enter'&&state!=='play')begin()});
let sx=0,sy=0;
addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});
addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;
  if(Math.abs(dx)<24&&Math.abs(dy)<24)return;
  if(Math.abs(dy)>Math.abs(dx)){if(dy<0)jump()}else move(dx>0?1:-1)},{passive:true});

// loop
const clock=new THREE.Clock();
function frame(){
  requestAnimationFrame(frame);
  const dt=Math.min(clock.getDelta(),.05);t+=dt;
  const v=state==='play'?speed:state==='menu'?7:Math.max(0,speed*.9);
  if(state==='over')speed=v;
  const dz=v*dt;
  marks.forEach(m=>{m.position.z+=dz;if(m.position.z>8)m.position.z-=132});
  pil.forEach(p=>{p.position.z+=dz;if(p.position.z>14)p.position.z-=140});
  if(state==='play'){
    dist+=dz;speed=Math.min(36,15+dist*.012);
    score=dist*.6+gemsN*60;
    while(nextZ>-110+(-dist*0)&&false){}
    nextZ+=dz;
    if(nextZ>-70){spawn(-95);nextZ-=Math.max(16,30-speed*.35)}
    player.position.x+=(LANES[lane]-player.position.x)*Math.min(1,dt*14);
    vy-=26*dt;py+=vy*dt;if(py<.7){py=.7;vy=0}
    for(const e of ents){
      e.m.position.z+=dz;
      if(e.t==='g'){e.m.rotation.y+=dt*2.4;e.m.position.y=1.1+Math.sin(t*3+e.m.position.x)*.12}
      const dx=Math.abs(e.m.position.x-player.position.x),dzz=Math.abs(e.m.position.z);
      if(e.t==='g'&&!e.dead&&dx<.9&&dzz<.9&&Math.abs(py-1.1)<1){e.dead=true;S.remove(e.m);gemsN++}
      else if(e.t==='o'&&dx<1.05&&dzz<1.05&&py<1.55){end();break}
    }
    ents=ents.filter(e=>!e.dead&&e.m.position.z<8||(S.remove(e.m),false));
    $('score').textContent=fa(score);$('gems').textContent=fa(gemsN);
    $('spd').style.width=((speed-15)/21*100)+'%';
  }
  player.position.y=py;player.rotation.x-=dz*.9;ring.position.set(player.position.x,.04,0);
  ring.scale.setScalar(1+Math.sin(t*4)*.04);
  rim.position.set(player.position.x,3,2);
  shake*=.9;
  const px=player.position.x;
  cam.position.set(px*.55+(Math.random()-.5)*shake*.4,4.3+py*.25,7.2);
  cam.lookAt(px*.4,1.1,-9);
  if(state==='menu'){cam.position.x=Math.sin(t*.4)*2.2;cam.lookAt(0,1.2,-9)}
  R.render(S,cam);
}
frame();
})();
</script>
</body>
</html>
